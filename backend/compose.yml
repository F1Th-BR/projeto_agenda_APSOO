services:
  postgres:
    image: postgres:16
    container_name: sai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sai}
      POSTGRES_USER: ${POSTGRES_USER:-sai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sai_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sai_user} -d ${POSTGRES_DB:-sai}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sai_postgres_data: