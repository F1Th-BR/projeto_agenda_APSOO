spring.application.name=sai

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:sai}
spring.datasource.username=${POSTGRES_USER:sai_user}
spring.datasource.password=${POSTGRES_PASSWORD:sai_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.time-zone=America/Manaus
spring.jpa.properties.hibernate.jdbc.time_zone=UTC