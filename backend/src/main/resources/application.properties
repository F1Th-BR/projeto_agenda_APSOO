spring.config.import=optional:file:.env[.properties]

spring.application.name=sai

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:sai}
spring.datasource.username=${POSTGRES_USER:sai_user}
spring.datasource.password=${POSTGRES_PASSWORD:sai_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.time-zone=America/Manaus

# Segredo usado para assinar os tokens JWT (mínimo 32 caracteres). Definir JWT_SECRET no .env
app.jwt.secret=${JWT_SECRET:dev-secret-troque-em-producao-0123456789}

# Antecedência mínima (em horas) para a cliente cancelar/remarcar pelo link único (RF052)
app.agenda.horas-antecedencia-cliente=2

# Origens do front-end autorizadas (CORS), separadas por vírgula
app.cors.origens=http://localhost:3000,http://localhost:5173
